[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-spacecash"
version = "0.2.0"
description = "NorthStar Prime's signed, auditable, closed-loop ledger and peer protocol"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "NorthStar Prime" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security :: Cryptography",
]
dependencies = ["cryptography>=44,<48"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
spacecash = "tools.spacecash_cli:main"
spacecashd = "tools.spacecash_daemon:main"

[tool.setuptools.packages.find]
include = ["spacecash_core*", "northstar_catalog*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
