name: attest-release-provenance

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose assets will be verified and attested
        required: true
        type: string

concurrency:
  group: attest-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest-release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 2
          fi
          mkdir release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets
          test -f release-assets/SHA256SUMS.txt
          (
            cd release-assets
            test -s SHA256SUMS.txt
            if grep -Ev '^[0-9A-Fa-f]{64}  northstar_spacecash-[A-Za-z0-9._+-]+\.(whl|tar\.gz)$' SHA256SUMS.txt | grep -q .; then
              echo "SHA256SUMS.txt contains an unexpected subject" >&2
              exit 2
            fi
            grep -Eq '  northstar_spacecash-.*\.whl$' SHA256SUMS.txt
            grep -Eq '  northstar_spacecash-.*\.tar\.gz$' SHA256SUMS.txt
            sha256sum --check --strict SHA256SUMS.txt
          )

      - name: Create keyless build-provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS.txt
