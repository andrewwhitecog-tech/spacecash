name: attest-release-provenance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose assets will be verified and attested
        required: true
        default: v0.2.2
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest-release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets
          test -f release-assets/SHA256SUMS.txt
          (
            cd release-assets
            sha256sum --check SHA256SUMS.txt
          )

      - name: Create keyless build-provenance attestations
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: release-assets/SHA256SUMS.txt
