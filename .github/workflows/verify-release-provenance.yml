name: verify-release-provenance

on:
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify; empty selects the latest release
        required: false
        type: string

permissions:
  contents: read
  attestations: read

concurrency:
  group: verify-release-provenance
  cancel-in-progress: false

jobs:
  verify-release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve, download, and checksum release assets
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          release_tag="$REQUESTED_TAG"
          if [[ -z "$release_tag" ]]; then
            release_tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $release_tag" >&2
            exit 2
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          mkdir release-assets
          gh release download "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets
          (
            cd release-assets
            test -s SHA256SUMS.txt
            if grep -Ev '^[0-9A-Fa-f]{64}  northstar_spacecash-[A-Za-z0-9._+-]+\.(whl|tar\.gz)$' SHA256SUMS.txt | grep -q .; then
              echo "SHA256SUMS.txt contains an unexpected subject" >&2
              exit 2
            fi
            grep -Eq '  northstar_spacecash-.*\.whl$' SHA256SUMS.txt
            grep -Eq '  northstar_spacecash-.*\.tar\.gz$' SHA256SUMS.txt
            sha256sum --check --strict SHA256SUMS.txt
          )

      - name: Verify every release subject against keyless provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while read -r _ subject; do
            gh attestation verify "release-assets/$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/attest-release-provenance.yml" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners
          done < release-assets/SHA256SUMS.txt
